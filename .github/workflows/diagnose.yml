name: diagnose

# Read-only. Answers "what actually happened to the instance" when show-ip says
# there is no RUNNING one - because that filter cannot distinguish STOPPED from
# TERMINATED from never-existed, and those have completely different fixes.
#
# Lists every instance in every lifecycle state, then the boot volumes (a volume
# outliving its instance means the data is still there and it can be relaunched),
# then recent work requests, which is the only record of WHO terminated it and WHEN.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
    steps:
      - name: Install OCI CLI
        run: pipx install oci-cli

      - name: Every instance, every state
        run: |
          set +e
          C="$OCI_CLI_TENANCY"
          AD=$(oci iam availability-domain list -c "$C" --query 'data[0].name' --raw-output)
          echo "=== ACTUAL AVAILABILITY DOMAIN: $AD ==="
          echo "(main.tf hardcodes qUCo:AP-MUMBAI-1-AD-1 - if that differs, the tenancy was recreated)"

          echo
          echo "=== A1 SERVICE LIMITS (the launch failed on these) ==="
          for L in standard-a1-core-count standard-a1-memory-count; do
            AV=$(oci limits value list -c "$C" --service-name compute --name "$L" --availability-domain "$AD" --query 'data[0].value' --raw-output 2>/dev/null)
            USED=$(oci limits resource-availability get --service-name compute --limit-name "$L" -c "$C" --availability-domain "$AD" --query 'data."used"' --raw-output 2>/dev/null)
            AVAIL=$(oci limits resource-availability get --service-name compute --limit-name "$L" -c "$C" --availability-domain "$AD" --query 'data."available"' --raw-output 2>/dev/null)
            echo "  $L -> limit=$AV used=$USED available=$AVAIL"
          done
          echo "=== INSTANCES (all lifecycle states) ==="
          oci compute instance list -c "$C" --all \
            --query 'data[].{name:"display-name",state:"lifecycle-state",shape:shape,created:"time-created"}' \
            --output table 2>&1 | head -40

          echo
          echo "=== BOOT-VOLUME REUSE PRE-FLIGHT (what launch-arm.sh will resolve) ==="
          BV=$(oci bv boot-volume list -c "$C" --availability-domain "$AD" \
            --query "data[?\"lifecycle-state\"=='AVAILABLE' && starts_with(\"display-name\", 'market-genie')]|[0].id" \
            --raw-output 2>&1)
          if [ -n "$BV" ] && [ "$BV" != "null" ]; then
            echo "  RESOLVED -> $BV"
            echo "  (the hunter will relaunch from this volume, keeping your data)"
          else
            echo "  EMPTY -> the hunter would build from a fresh image and orphan the old volume"
          fi

          echo
          echo "=== BOOT VOLUMES (data survives a terminated instance if these remain) ==="
          oci bv boot-volume list -c "$C" --availability-domain "$AD" \
            --query 'data[].{name:"display-name",state:"lifecycle-state",gb:"size-in-gbs",created:"time-created"}' \
            --output table 2>&1 | head -14

          echo
          echo "=== RECENT WORK REQUESTS (who did what, and when) ==="
          oci work-requests work-request list -c "$C" --all \
            --query 'data[].{op:"operation-type",status:status,accepted:"time-accepted"}' \
            --output table 2>&1 | head -30

          echo
          echo "=== ACCOUNT / TENANCY ==="
          oci iam tenancy get --tenancy-id "$C" \
            --query 'data.{name:name,home:"home-region-key"}' --output table 2>&1 | head -10
