name: arm-hunter

# Hunts for Always-Free Ampere A1 (ARM) capacity and creates the instance the
# moment a slot frees up. Each run loops internally (every 5 min for ~5.5h);
# the cron just restarts the loop. On success it opens an issue and disables
# itself. Kicked off continuously without relying on GitHub's flaky cron.

on:
  schedule:
    # Backup only. Each run loops internally for ~5.5h, so cron just needs to
    # fire occasionally to start the next long loop. Offset off round minutes.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}      # allow manual "Run workflow" from the Actions tab

# Never let two runs launch at once -> can't create duplicate instances.
concurrency:
  group: arm-hunter
  cancel-in-progress: false

permissions:
  contents: read
  issues: write     # to open the success notification issue
  actions: write    # to disable this workflow once we win

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # each run loops internally for ~5.5h (job max is 6h)
    env:
      # --- auth (from encrypted GitHub secrets) ---
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}

      # --- non-secret config ---
      # Compartment defaults to the tenancy root; availability domain and image
      # are auto-detected live from your account by the script. Leave them unset.
      SHAPE: "VM.Standard.A1.Flex"
      # 2/12, not 4/24. The tenancy's A1 service limit reports
      # standard-a1-core-count=2 and standard-a1-memory-count=12, so asking for
      # 4/24 fails instantly with LimitExceeded - which is NOT a capacity error
      # and so is not retryable. main.tf had 2/12 all along; only this file drifted.
      OCPUS: "2"
      MEM_GB: "12"
      # Try the full allowance, then half. A host with one spare core refuses
      # 2/12 but takes 1/6, so asking only for the maximum turns down slots we
      # would gladly have. Two 1-OCPU instances fit the same allowance anyway.
      SHAPE_LADDER: "2/12,1/6"
      INSTANCE_DISPLAY_NAME: "market-genie"
      ASSIGN_PUBLIC_IP: "true"
      LOOP_MINUTES: "330"        # keep retrying within a single run for 5.5h
      INTERVAL_SECONDS: "300"    # one attempt every 5 minutes inside the loop
      SSH_PUBKEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJJ5Z6epXkLl+BfrK8A0NAv3ibxG5hBF4SqbN7V6eWtj oci-arm-instance"

    steps:
      - uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          pipx install oci-cli
          oci --version

      - name: Hunt for ARM capacity
        id: hunt
        run: bash scripts/launch-arm.sh

      - name: Notify + stop on success
        if: steps.hunt.outputs.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Built with echo into a file rather than inlined: a multi-line --body
          # inside a YAML block scalar has to carry the block's indentation, and
          # markdown would then render the whole thing as a code block.
          {
            echo "The A1.Flex instance is up."
            echo
            echo "- **Size:** ${WON_SHAPE:-unknown}"
            echo "- **Public IP:** ${PUBLIC_IP:-check OCI console}"
            echo "- **SSH:** \`ssh -i oci_instance_key opc@${PUBLIC_IP}\`"
            echo
            echo "This workflow has been disabled."
            echo
            if [ "${SPARE_OCPUS:-0}" -gt 0 ] 2>/dev/null; then
              echo "**${SPARE_OCPUS} OCPU of the allowance is still unused.** To chase a"
              echo "second instance with the remainder, set \`INSTANCE_DISPLAY_NAME\` to a"
              echo "new name and \`SHAPE_LADDER\` to the leftover size, then re-enable this"
              echo "workflow."
              echo
            fi
            echo "Heads up: Oracle reclaims an Always Free instance whose 95th-percentile"
            echo "CPU stays under 20% for 7 days. That is how the last one was lost."
          } > /tmp/issue-body.md
          gh issue create \
            --title "🎉 Always-Free ARM instance is ready (${WON_SHAPE:-A1})" \
            --body-file /tmp/issue-body.md \
            || echo "issue create skipped"
          gh workflow disable arm-hunter.yml || echo "disable skipped"
